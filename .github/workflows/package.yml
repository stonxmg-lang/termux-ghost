name: Package

# Builds the Termux package from packaging/tur/termux-ghost/build.sh with the
# official termux-packages build system, installs it in real Termux and runs
# the full test suite against the installed library.
# On a v* tag it uses the tag's tarball and prints the SHA256 for build.sh.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    name: Package ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, i686, arm]
    steps:
      - uses: actions/checkout@v4

      - name: Point build.sh at this tag or commit
        id: src
        run: |
          repo=https://github.com/${{ github.repository }}
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            url="$repo/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          else
            url="$repo/archive/$GITHUB_SHA.tar.gz"
          fi
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          cp -r packaging/tur/termux-ghost /tmp/termux-ghost
          sed -i "s|^TERMUX_PKG_SRCURL=.*|TERMUX_PKG_SRCURL=$url|; s|^TERMUX_PKG_SHA256=.*|TERMUX_PKG_SHA256=$sha|" /tmp/termux-ghost/build.sh
          echo "### Source" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$url\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`TERMUX_PKG_SHA256=$sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "TERMUX_PKG_SHA256=$sha"

      - name: Build with termux-packages
        run: |
          git clone -q --depth 1 https://github.com/termux/termux-packages ~/termux-packages
          cp -r /tmp/termux-ghost ~/termux-packages/packages/termux-ghost
          cd ~/termux-packages
          ./scripts/run-docker.sh ./build-package.sh -I -a ${{ matrix.arch }} termux-ghost
          ls -la output
          mkdir -p "$GITHUB_WORKSPACE/debs"
          cp output/termux-ghost_*.deb "$GITHUB_WORKSPACE/debs/"

      - uses: actions/upload-artifact@v4
        with:
          name: termux-ghost-${{ matrix.arch }}
          path: |
            debs/*.deb
            /tmp/termux-ghost/build.sh

      - name: Set up QEMU for ARM
        if: matrix.arch == 'aarch64' || matrix.arch == 'arm'
        run: docker run --rm --privileged aptman/qus -s -- -p ${{ matrix.arch }}

      # 32-bit Termux breaks on PIDs above 65535 (termux-docker#40).
      - name: Limit PIDs for 32-bit
        if: matrix.arch == 'i686' || matrix.arch == 'arm'
        run: sudo sysctl -w kernel.pid_max=65536

      - name: Install the package in Termux and run the tests against it
        run: |
          docker run --rm --privileged -v "$PWD:/src:ro" \
            termux/termux-docker:${{ matrix.arch }} bash -c '
              set -euo pipefail
              apt-get update -q
              apt-get -yq -o Dpkg::Options::=--force-confnew upgrade
              apt-get -yq install tmux
              cp /src/debs/termux-ghost_*.deb ~/
              apt-get -yq install ~/termux-ghost_*.deb
              dpkg -L termux-ghost
              lib=$PREFIX/lib/bash/ghost
              test -f "$lib"
              bash -c "enable -f $lib ghost && ghost status"
              cp -r /src ~/termux-ghost
              GHOST_SO=$lib ~/termux-ghost/tests/run.sh
              apt-get -yq remove termux-ghost
              test ! -e "$lib"
            '
